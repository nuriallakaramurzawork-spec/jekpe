<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEKPE Scoreboard — офлайн-табло для единоборств</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#000;color:#fff;overflow-x:hidden}
button,select,input{font:inherit}
button{cursor:pointer;border:0}
#app{min-height:100vh;display:flex;flex-direction:column}
/* settings bar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px 16px;background:#111;border-bottom:1px solid #262626}
.logo{font-weight:900;letter-spacing:.06em;font-size:18px;margin-right:8px;align-self:center}
.logo span{color:#e11d2e}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:#a1a1aa;text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select{background:#000;border:1px solid #333;color:#fff;border-radius:8px;padding:7px 9px;font-size:14px;min-width:0}
.fld input{width:150px}
.fld input.sm{width:110px}
.b{padding:8px 13px;border-radius:8px;font-weight:700;font-size:14px;background:#222;color:#fff}
.b:hover{background:#2e2e2e}
.b.red{background:#e11d2e}.b.red:hover{background:#ff3344}
.lang{display:flex;background:#000;border:1px solid #333;border-radius:8px;padding:2px;align-self:flex-end}
.lang button{background:none;color:#a1a1aa;padding:6px 9px;border-radius:6px;font-size:12px;font-weight:700}
.lang button.on{background:#e11d2e;color:#fff}
.sp{flex:1}
/* board */
.board{flex:1;display:flex;flex-direction:column}
.row{flex:1;display:flex;flex-direction:column;position:relative;min-height:190px}
.main{flex:1;display:flex;align-items:center;padding:10px 24px;gap:20px}
.who{flex:1;min-width:0}
.nm{font-size:clamp(28px,5vw,72px);font-weight:900;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.cl{font-size:clamp(14px,2vw,26px);opacity:.8;margin-top:6px;font-weight:600}
.subs{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.35);border-radius:10px;padding:6px 12px;font-weight:800;font-size:clamp(14px,1.8vw,26px);display:flex;gap:8px;align-items:center}
.chip small{font-size:.6em;opacity:.75;letter-spacing:.06em}
.card{width:22px;height:30px;border-radius:3px;background:#facc15;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.card.r{background:#dc2626}
.senshu{background:#fff;color:#000;border-radius:10px;padding:6px 12px;font-weight:900;font-size:clamp(14px,1.8vw,24px)}
.score{font-size:clamp(90px,17vw,240px);font-weight:900;line-height:.9;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.jd{display:flex;gap:18px;align-items:flex-end}
.jd div{text-align:center}
.jd b{display:block;font-size:clamp(80px,14vw,200px);line-height:.9;font-variant-numeric:tabular-nums}
.jd small{font-size:clamp(14px,2vw,26px);font-weight:800;opacity:.8}
.ipp{font-size:clamp(50px,9vw,130px);font-weight:900}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:0 24px 12px}
.acts button{background:rgba(0,0,0,.4);color:inherit;border:1px solid rgba(255,255,255,.25);padding:9px 12px;border-radius:9px;font-weight:700;font-size:14px}
.acts button:hover{background:rgba(0,0,0,.6)}
.acts button.pen{border-color:#facc15}
.acts button.win{border-color:#fff;background:rgba(255,255,255,.15)}
.acts button.on{background:#fff;color:#000}
.dark .acts button{border-color:rgba(0,0,0,.3);background:rgba(0,0,0,.06)}
.dark .acts button:hover{background:rgba(0,0,0,.14)}
.dark .chip{background:rgba(0,0,0,.08)}
/* middle */
.mid{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;background:#000;border-top:2px solid #1f1f1f;border-bottom:2px solid #1f1f1f;flex-wrap:wrap}
.cat{font-size:clamp(14px,2vw,26px);font-weight:800;color:#a1a1aa;min-width:160px}
.per{font-size:clamp(13px,1.6vw,22px);font-weight:800;color:#e11d2e;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.timer{font-size:clamp(70px,12vw,170px);font-weight:900;color:#facc15;font-variant-numeric:tabular-nums;line-height:1;cursor:pointer;user-select:none}
.timer.run{color:#22c55e}
.timer.gs{color:#38bdf8}
.timer.brk{color:#a1a1aa}
.hold{min-width:160px;text-align:right}
.hold .hv{font-size:clamp(40px,6vw,90px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.hold .hl{font-size:13px;font-weight:800;color:#a1a1aa;text-transform:uppercase;letter-spacing:.08em}
.hbar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-top:6px}
.hbar i{display:block;height:100%;background:#facc15;transition:width .1s linear}
/* controls */
.ctrl{display:flex;gap:8px;justify-content:center;padding:12px;background:#0a0a0a;border-top:1px solid #1f1f1f;flex-wrap:wrap}
.ctrl .b{padding:12px 20px;font-size:16px}
.ctrl .go{background:#16a34a;min-width:150px}.ctrl .go:hover{background:#22c55e}
.ctrl .go.stop{background:#dc2626}
.keys{text-align:center;color:#52525b;font-size:12px;padding:0 0 10px;background:#0a0a0a}
/* viewer mode */
.viewer .bar,.viewer .acts,.viewer .ctrl,.viewer .keys{display:none}
.exitv{display:none;position:fixed;top:10px;right:10px;z-index:30;background:rgba(255,255,255,.08);color:#777;padding:6px 10px;border-radius:8px;font-size:12px}
.viewer .exitv{display:block}
/* winner */
.winov{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:40;text-align:center;padding:20px}
.winov.show{display:grid}
.winov .wl{font-size:clamp(18px,3vw,34px);color:#facc15;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.winov .wn{font-size:clamp(40px,8vw,110px);font-weight:900;text-transform:uppercase;margin:10px 0;line-height:1}
.winov .wr{font-size:clamp(16px,2.4vw,30px);color:#d4d4d8;font-weight:700}
.winov .wb{margin-top:30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.winov .wb .b{padding:12px 22px;font-size:16px}
@media(max-width:700px){.main{padding:10px 14px}.acts{padding:0 14px 10px}.fld input{width:120px}}
</style>
</head>

en:{sport:"Sport",time:"Time",cat:"Division",club:"Club",apply:"New match",viewer:"Viewer mode",full:"Fullscreen",start:"START",pause:"PAUSE",undo:"↶ Undo",reset:"Reset",newbout:"New match",winner:"Winner",ctrlmode:"control panel",

};
let L="ru";const T=k=>(TX[L][k]??TX.ru[k]??k);

/* sport configs */
const SP={
 bjj:{time:300,durs:[120,180,240,300,360,420,480,600],col:[["#15803d","green"],["#a16207","yellow"]],
  acts:[["tk",2],["sw",2],["kob",2],["pass",3],["mount",4],["back",4]],extra:["adv","pen","sub"]},
 judo:{time:240,durs:[120,180,240,300],col:[["#f4f4f5","white",1],["#1d4ed8","blue"]],judo:1,extra:["ippon","waza","yuko","osae","shido"]},
 free:{time:180,periods:2,brk:30,limit:10,durs:[120,180],col:[["#b91c1c","red"],["#1d4ed8","blue"]],
  acts:[["p1",1],["p2",2],["p4",4],["p5",5]],extra:["caut1","caut2","fall"]},
 greco:{time:180,periods:2,brk:30,limit:8,durs:[120,180],col:[["#b91c1c","red"],["#1d4ed8","blue"]],
  acts:[["p1",1],["p2",2],["p4",4],["p5",5]],extra:["caut1","caut2","fall"]},
 sambo:{time:300,limit:8,durs:[180,240,300],col:[["#b91c1c","red"],["#1d4ed8","blue"]],
  acts:[["th1",1],["th2",2],["th4",4]],extra:["hold","remark","subm","total"]},
 karate:{time:180,limit:8,durs:[60,90,120,180],col:[["#b91c1c","red"],["#1d4ed8","blue"]],
  acts:[["kyuko",1],["kwaza",2],["kippon",3]],extra:["kpen","senshu"]}
};
let sport="bjj",C=SP.bjj,S,undoStack=[],viewer=false;
const mk=()=>({pts:0,adv:0,pen:0,w:0,y:0,hist:[],senshu:false});
function fresh(){return{f:[mk(),mk()],t:+document.getElementById("dur").value||C.time,dur:+document.getElementById("dur").value||C.time,run:false,per:1,brk:false,gold:false,win:null,hold:null,last:null,ref:false}}
const save=()=>{undoStack.push(JSON.stringify(S));if(undoStack.length>200)undoStack.shift()};
function undo(){if(!undoStack.length)return;const run=S.run;S=JSON.parse(undoStack.pop());S.run=run&&!S.win;last=performance.now();render()}
function undoWin(){undo()}

/* scoring */
const O=i=>1-i;
function lead(i){const d=S.f[i].pts-S.f[O(i)].pts;if(C.limit&&d>=C.limit)win(i,"r_tech")}
function add(i,v){if(S.win)return;save();const f=S.f[i];f.pts+=v;f.hist.push(v);S.last=i;
 if(sport==="karate"&&!S.f[0].senshu&&!S.f[1].senshu&&!S.senshuDone&&v>0){f.senshu=true;S.senshuDone=true}
 lead(i);render()}
function give(i,v){const f=S.f[i];f.pts+=v;f.hist.push(v);S.last=i;lead(i)}
function act(i,k){
 if(S.win)return;const f=S.f[i],o=S.f[O(i)];
 if(k==="osae"||k==="hold"){save();if(S.hold&&S.hold.i===i){endHold()}else{if(S.hold)endHold();S.hold={i,s:0}}render();return}
 save();
 switch(k){
  case"adv":f.adv++;break;
  case"pen":f.pen++;if(f.pen===2)o.adv++;if(f.pen===3)o.pts+=2;if(f.pen>=4)win(O(i),"r_dq");break;
  case"sub":win(i,"r_sub");break;
  case"ippon":win(i,"r_ippon");break;
  case"waza":f.w++;if(f.w>=2)win(i,"r_aw");else if(S.gold)win(i,"r_gs");break;
  case"yuko":f.y++;if(S.gold)win(i,"r_gs");break;
  case"shido":f.pen++;if(f.pen>=3)win(O(i),"r_hans");break;
  case"caut1":case"caut2":f.pen++;give(O(i),k==="caut1"?1:2);if(f.pen>=3&&!S.win)win(O(i),"r_dq");break;
  case"fall":win(i,"r_fall");break;
  case"remark":f.pen++;if(f.pen===1)give(O(i),1);else if(f.pen===2)give(O(i),2);else win(O(i),"r_dq");break;
  case"subm":win(i,"r_subm");break;
  case"total":win(i,"r_total");break;
  case"kpen":f.pen=Math.min(f.pen+1,4);if(f.pen>=4)win(O(i),"r_hans");break;
  case"senshu":if(f.senshu)f.senshu=false;else{f.senshu=true;o.senshu=false;S.senshuDone=true}break;
  case"dec":win(i,"r_dec");break;
 }
 render();
}
function endHold(){const h=S.hold;if(!h)return;S.hold=null;const f=S.f[h.i],s=h.s;
 if(C.judo){if(s>=20)win(h.i,"r_ippon");else if(s>=10){f.w++;if(f.w>=2)win(h.i,"r_aw");else if(S.gold)win(h.i,"r_gs")}else if(s>=5){f.y++;if(S.gold)win(h.i,"r_gs")}}
 else{if(s>=20)give(h.i,4);else if(s>=10)give(h.i,2)}
 if(!S.win&&S.t<=0&&!S.gold&&!S.brk)timeUp();
}
function holdTick(){const h=S.hold;if(!h)return;const f=S.f[h.i];
 if(C.judo){if(h.s>=20||(h.s>=10&&f.w>=1)){endHold();buzz()}}
 else if(h.s>=20){endHold();buzz()}}

/* decisions */
function cmp(a,b){return a>b?0:b>a?1:null}
function decide(){
 const [a,b]=S.f;let r;
 if(sport==="bjj"){
  if((r=cmp(a.pts,b.pts))!==null)return win(r,"r_points");
  if((r=cmp(a.adv,b.adv))!==null)return win(r,"r_adv");
  if((r=cmp(b.pen,a.pen))!==null)return win(r,"r_pen");
  S.ref=true;
 }else if(C.judo){
  if((r=cmp(a.w,b.w))!==null)return win(r,"r_score");
  if((r=cmp(a.y,b.y))!==null)return win(r,"r_score");
  S.gold=true;S.t=0;
 }else if(sport==="karate"){
  if((r=cmp(a.pts,b.pts))!==null)return win(r,"r_points");
  if(a.senshu!==b.senshu)return win(a.senshu?0:1,"r_senshu");
  S.ref=true;
 }else{
  if((r=cmp(a.pts,b.pts))!==null)return win(r,"r_points");
  const top=x=>[5,4,2,1].map(v=>x.hist.filter(h=>h===v).length);
  const ta=top(a),tb=top(b);for(let k=0;k<4;k++)if((r=cmp(ta[k],tb[k]))!==null)return win(r,"r_crit");
  if((r=cmp(b.pen,a.pen))!==null)return win(r,"r_crit");
  if(S.last!==null)return win(S.last,"r_crit");
  S.ref=true;
 }
 render();
}
function win(i,reason){S.win={i,reason};S.run=false;S.hold=null;buzz();render()}
function timeUp(){
 if(S.brk){S.brk=false;S.per++;S.t=S.dur;render();return}
 if(C.periods&&S.per<C.periods){S.brk=true;S.t=C.brk;S.run=true;last=performance.now();render();return}
 if(S.hold)return;
 decide();
}

/* clock */
let last=performance.now();
function toggle(){if(S.win)return;if(S.ref)return;if(!S.gold&&S.t<=0&&!S.brk)return;S.run=!S.run;last=performance.now();ensureAudio();render()}
function adj(d){if(S.win)return;S.t=Math.max(0,S.t+d);render()}
setInterval(()=>{const now=performance.now(),dt=(now-last)/1000;last=now;
 if(S.hold&&!S.win){S.hold.s+=dt;holdTick()}
 if(S.run&&!S.win){
  if(S.gold){S.t+=dt}else{S.t-=dt;if(S.t<=0){S.t=0;S.run=false;buzz();timeUp()}}
 }
 paintClock();
},100);
const fmt=s=>{s=Math.max(0,s);const c=S.gold?Math.floor(s):Math.ceil(s-1e-6);return Math.floor(c/60)+":"+String(c%60).padStart(2,"0")};

/* audio */
let AC=null;function ensureAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
function buzz(){try{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=330;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+1.1)}catch(e){}}

/* render */
function names(i){return{n:document.getElementById("n"+i).value||"—",c:document.getElementById("c"+i).value}}
function subs(i){const f=S.f[i];let h="";
 if(sport==="bjj")h=`<span class="chip"><small>ADV</small>${f.adv}</span><span class="chip"><small>PEN</small>${f.pen}</span>`;
 else if(C.judo)h=f.pen?`<span class="chip"><small>SHIDO</small>${Array.from({length:f.pen},(_,k)=>`<i class="card${f.pen>=3&&k===2?" r":""}"></i>`).join("")}</span>`:"";
 else if(sport==="karate"){const lv=["","C1","C2","C3","H"];h=(f.pen?`<span class="chip"><small>PEN</small>${lv[f.pen]}</span>`:"")+(f.senshu?`<span class="senshu">${T("senshu")}</span>`:"")}
 else h=`<span class="chip"><small>${sport==="sambo"?"!":"C"}</small>${"●".repeat(f.pen)||"0"}</span>`;
 return h}
function score(i){const f=S.f[i];
 if(C.judo){if(S.win&&S.win.i===i&&["r_ippon","r_aw"].includes(S.win.reason))return`<div class="ipp">IPPON</div>`;
  return`<div class="jd"><div><b>${f.w}</b><small>WAZA-ARI</small></div><div><b>${f.y}</b><small>YUKO</small></div></div>`}
 return`<div class="score">${f.pts}</div>`}
function buttons(i){let h="";
 (C.acts||[]).forEach(([k,v])=>h+=`<button onclick="add(${i},${v})">${T(k)}</button>`);
 (C.extra||[]).forEach(k=>{const lbl=k==="osae"?T("osae"):k==="hold"?T("hold"):T(k);
  const on=(k==="osae"||k==="hold")&&S.hold&&S.hold.i===i?" on":"";
  const cls=["pen","shido","caut1","caut2","remark","kpen"].includes(k)?"pen":["sub","ippon","fall","subm","total"].includes(k)?"win":"";
  h+=`<button class="${cls}${on}" onclick="act(${i},'${k}')">${lbl}</button>`});
 h+=`<button class="win" onclick="act(${i},'dec')">${T("dec")}</button>`;
 return h}
function render(){
 [0,1].forEach(i=>{const r=document.getElementById("r"+i),[bg,cname,dark]=C.col[i],nm=names(i);
  r.style.background=bg;r.style.color=dark?"#111":"#fff";r.className="row"+(dark?" dark":"");
  r.innerHTML=`<div class="main"><div class="who"><div class="nm">${esc(nm.n)}</div><div class="cl">${esc(nm.c)}</div><div class="subs">${subs(i)}</div></div>${score(i)}</div><div class="acts">${buttons(i)}</div>`;
  document.getElementById("lab"+i).textContent=T(cname);
 });
 document.getElementById("catv").textContent=document.getElementById("cat").value;
 const per=S.brk?T("brk"):S.gold?T("gs"):S.ref?T("pick"):C.periods?T("period")+" "+S.per+"/"+C.periods:T("s_"+sport).replace(/ \(.+\)/,"");
 document.getElementById("perv").textContent=per;
 const go=document.getElementById("go");go.textContent=S.run?T("pause"):T("start");go.classList.toggle("stop",S.run);
 const w=document.getElementById("win");
 if(S.win){w.classList.add("show");w.querySelector("#wn").textContent=names(S.win.i).n;w.querySelector("#wr").textContent=T(S.win.reason);w.style.boxShadow=`inset 0 0 0 14px ${C.col[S.win.i][0]}`}
 else w.classList.remove("show");
 paintClock();
}
function paintClock(){
 const tm=document.getElementById("tm");tm.textContent=fmt(S.t);
 tm.className="timer"+(S.brk?" brk":S.gold?" gs":S.run?" run":"");
 const h=document.getElementById("hold");
 if(S.hold){const s=S.hold.s,max=20;h.innerHTML=`<div class="hl" style="color:${C.col[S.hold.i][0]==="#f4f4f5"?"#fff":C.col[S.hold.i][0]}">${C.judo?T("osae"):T("hold")}</div><div class="hv">${Math.floor(s)}s</div><div class="hbar"><i style="width:${Math.min(100,s/max*100)}%"></i></div>`}
 else h.innerHTML="";
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* setup */
function fillSelects(keepDur){
 const sp=document.getElementById("sport"),cur=sport;
 sp.innerHTML=Object.keys(SP).map(k=>`<option value="${k}">${T("s_"+k)}</option>`).join("");sp.value=cur;
 const d=document.getElementById("dur"),old=d.value;
 d.innerHTML=C.durs.map(s=>`<option value="${s}">${s%60?(s/60).toFixed(1).replace(".",","):s/60} ${T("min")}${C.periods?" × "+C.periods:""}</option>`).join("");
 d.value=keepDur&&C.durs.includes(+old)?old:C.time;
}
document.getElementById("sport").onchange=e=>{sport=e.target.value;C=SP[sport];fillSelects(false);newBout()};
document.getElementById("dur").onchange=()=>newBout();
["n0","n1","c0","c1","cat"].forEach(id=>document.getElementById(id).oninput=()=>render());
function newBout(){S=fresh();undoStack=[];render()}
function setLang(l){L=l;document.documentElement.lang=l==="kz"?"kk":l;
 document.querySelectorAll("[data-t]").forEach(e=>e.textContent=T(e.dataset.t));
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
 fillSelects(true);if(S)render();try{localStorage.setItem("jekpe-sb-lang",l)}catch(e){}}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
function toggleViewer(){viewer=!viewer;document.getElementById("app").classList.toggle("viewer",viewer);document.body.classList.toggle("viewer",viewer)}
function fs(){try{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}}
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
 if(e.code==="Space"){e.preventDefault();toggle()}else if(e.key==="z"||e.key==="Z"||e.key==="я"||e.key==="Я"){undo()}
 else if(e.key==="h"||e.key==="H"||e.key==="р"||e.key==="Р"){toggleViewer()}else if(e.key==="f"||e.key==="F"||e.key==="а"||e.key==="А"){fs()}});
let sl="ru";try{sl=localStorage.getItem("jekpe-sb-lang")||"ru"}catch(e){}
fillSelects(false);S=fresh();setLang(sl);
</script>
</body>
</html>
