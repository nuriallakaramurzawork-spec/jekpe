<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JEKPE — кабинет</title>

<style>
:root{--bg:#0a0a0b;--bg2:#121214;--card:#17171a;--line:#26262b;--text:#f4f4f5;--muted:#a1a1aa;--accent:#e11d2e;--accent2:#ff4d5a;--ok:#22c55e;--warn:#f5b301}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:rgba(10,10,11,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:.06em}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7a0b16);display:grid;place-items:center}
.links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.links a{padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px}
.links a:hover,.links a.on{color:var(--text);background:var(--bg2)}
.right{display:flex;gap:8px;align-items:center}
.lang{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px}
.lang button{background:none;color:var(--muted);padding:4px 9px;border-radius:6px;font-size:12px;font-weight:700}
.lang button.on{background:var(--accent);color:#fff}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.2}
.who b{color:var(--text);display:block;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-red{background:var(--accent);color:#fff}.btn-red:hover{background:var(--accent2)}
.btn-line{background:var(--bg2);border:1px solid var(--line);color:var(--text)}.btn-line:hover{border-color:#3f3f46}
.btn-ghost{background:none;color:var(--muted)}.btn-ghost:hover{color:var(--text)}
.btn-ok{background:rgba(34,197,94,.15);color:var(--ok);border:1px solid rgba(34,197,94,.35)}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
main{padding:36px 0 80px}
h1{font-size:32px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px}
h2{font-size:20px;font-weight:800;margin-bottom:14px}
.sub{color:var(--muted);margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;transition:.15s;display:block}
.ev:hover{border-color:#3f3f46;transform:translateY(-2px)}
.ev h3{font-size:17px;font-weight:800;margin:8px 0 6px}
.meta{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.st{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.st-pending{background:rgba(245,179,1,.12);color:var(--warn)}
.st-confirmed,.st-open,.st-live{background:rgba(34,197,94,.13);color:var(--ok)}
.st-cancelled,.st-closed,.st-finished{background:rgba(161,161,170,.12);color:var(--muted)}
.st-draft{background:rgba(225,29,46,.13);color:var(--accent2)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.auth{max-width:420px;margin:30px auto}
.msg{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px}
.msg-err{background:rgba(225,29,46,.12);color:#ff8a93;border:1px solid rgba(225,29,46,.3)}
.msg-ok{background:rgba(34,197,94,.1);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.msg-info{background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input[type=number]{width:80px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)}
td input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.tablewrap{overflow-x:auto}
.big{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stats div small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stats div b{font-size:26px;font-weight:900}
.div-box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--bg2)}
.div-box h4{font-size:15px;font-weight:800;display:flex;justify-content:space-between;gap:10px}
.names{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.names span{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.names span.p{opacity:.55}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{color:var(--muted);text-align:center;padding:30px}
.loader{color:var(--muted);padding:40px;text-align:center}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--text);color:#000;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14px;transition:.3s;z-index:200;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.bracket{display:flex;gap:28px;overflow-x:auto;padding:6px 2px 14px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:210px}
.bcol h5{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;margin-bottom:4px}
.bm{background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
.bm div{padding:7px 11px;display:flex;justify-content:space-between;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm div+div{border-top:1px solid var(--line)}
.bm .r{border-left:3px solid #dc2626}.bm .b{border-left:3px solid #2563eb}
.bm .w{font-weight:800;color:var(--text)}.bm .l{color:var(--muted)}.bm .e{color:#52525b;font-style:italic}
.bm small{color:var(--muted);font-size:11px}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer;color:var(--text)}
.chk input{accent-color:var(--accent)}
.burger{display:none;background:none;color:var(--text);font-size:24px}
@media(max-width:860px){
 .grid{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
 .links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);flex-direction:column;padding:10px 20px;border-bottom:1px solid var(--line)}
 .links.open{display:flex}.burger{display:block}.who{display:none}
}
@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:26px}}
</style>
</head>

function errText(e){const m=(e&&(e.message||e.error_description))||String(e);
 if(m.includes("NO_CREDITS"))return t("noCredits");if(m.includes("REG_CLOSED"))return t("regClosed");
 if(m.includes("duplicate key")||e.code==="23505")return t("already");return t("error")+": "+m}

/* ================= Supabase ================= */
const CFG=window.JEKPE_CONFIG;
const sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
let me=null,recovery=false;
async function loadMe(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){me=null;return}
 const {data,error}=await sb.rpc("my_profile");
 me=error||!data?{id:session.user.id,full_name:session.user.email,role:"athlete",credits:0}:data;
 me.email=session.user.email;
}
sb.auth.onAuthStateChange(async(ev)=>{
 if(ev==="PASSWORD_RECOVERY"){recovery=true;location.hash="reset"}
 if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="USER_UPDATED"){await loadMe();chrome();route()}
});
const isOrg=()=>me&&(me.role==="organizer"||me.role==="admin");

/* ================= chrome ================= */
function chrome(){
 document.documentElement.lang=L==="kz"?"kk":L;
 document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===L));
 const cur=(location.hash.slice(1)||"events").split("-")[0];
 const items=[["events",t("events")]];
 if(me)items.push(["my",t("my")]);
 if(isOrg())items.push(["org",t("org")]);
 if(me&&me.role==="admin")items.push(["admin",t("admin")]);
 $("links").innerHTML=items.map(([h,l])=>`<a href="#${h}" class="${cur===h||(h==="org"&&cur==="manage")||(h==="events"&&cur==="event")?"on":""}">${l}</a>`).join("");
 $("userbox").innerHTML=me
  ?`<div class="who"><b>${esc(me.full_name||me.email)}</b>${t("r_"+me.role)}${isOrg()?` · ${me.credits} ${t("credits").toLowerCase()}`:""}</div><button class="btn btn-ghost btn-sm" onclick="logout()">${t("logout")}</button>`
  :`<a class="btn btn-ghost btn-sm" href="#login">${t("login")}</a><a class="btn btn-red btn-sm" href="#signup">${t("signup")}</a>`;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("jekpe-lang",L)}catch(e){};chrome();route()});
async function logout(){await sb.auth.signOut();location.hash="events"}
function need(){if(!me){try{sessionStorage.setItem("jekpe-after",location.hash)}catch(e){};location.hash="login";return false}return true}
function afterLogin(){let h="events";try{h=sessionStorage.getItem("jekpe-after")||(isOrg()?"#org":"#events");sessionStorage.removeItem("jekpe-after")}catch(e){};location.hash=h.replace("#","")}

/* ================= router ================= */
window.addEventListener("hashchange",()=>{$("links").classList.remove("open");chrome();route()});
async function route(){
 const h=location.hash.slice(1)||"events";const [v,...r]=h.split("-");const id=r.join("-");
 const V=$("view");V.innerHTML=`<div class="loader">…</div>`;window.scrollTo(0,0);
 try{
  if(v==="login")return viewLogin();
  if(v==="signup")return viewSignup(id);
  if(v==="reset")return viewReset();
  if(v==="event")return viewEvent(id);
  if(v==="bracket")return viewBracket(id);
  if(v==="my"){if(!need())return;return viewMy()}
  if(v==="org"){if(!need())return;return viewOrg()}
  if(v==="manage"){if(!need())return;return viewManage(id)}
  if(v==="admin"){if(!need())return;return viewAdmin()}
  return viewEvents();
 }catch(e){V.innerHTML=`<div class="msg msg-err">${esc(errText(e))}</div>`}
}

/* ================= views: auth ================= */
function viewLogin(){
 if(me)return afterLogin();
 $("view").innerHTML=`<div class="auth card"><h1>${t("loginH")}</h1><p class="sub"></p><div id="m"></div>
 <form id="f"><div class="field"><label>${t("email")}</label><input type="email" name="email" required autocomplete="email"></div>
 <div class="field"><label>${t("password")}</label><input type="password" name="password" required autocomplete="current-password"></div>
 <button class="btn btn-red" style="width:100%">${t("login")}</button></form>
 <p class="meta" style="margin-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><a href="#" id="fg" style="text-decoration:underline">${t("forgot")}</a><span>${t("noAcc")} <a href="#signup" style="color:var(--accent2)">${t("signup")}</a></span></p></div>`;
 $("f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
  const {error}=await sb.auth.signInWithPassword({email:d.email,password:d.password});
  if(error)$("m").innerHTML=`<div class="msg msg-err">${esc(errText(error))}</div>`};
 $("fg").onclick=async e=>{e.preventDefault();const em=$("f").email.value;if(!em){$("f").email.focus();return}
  const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
  $("m").innerHTML=error?`<div class="msg msg-err">${esc(errText(error))}</div>`:`<div class="msg msg-ok">${t("resetSent")}</div>`};
}
function viewSignup(pre){
 if(me)return afterLogin();
 $("view").innerHTML=`<div class="auth card"><h1>${t("signupH")}</h1><p class="sub"></p><div id="m"></div>
 <form id="f"><div class="field"><label>${t("name")}</label><input name="full_name" required></div>
 <div class="field"><label>${t("iam")}</label><select name="role">${["athlete","coach","organizer"].map(r=>`<option value="${r}" ${pre===r?"selected":""}>${t("r_"+r)}</option>`).join("")}</select></div>
 <div class="field"><label>${t("email")}</label><input type="email" name="email" required autocomplete="email"></div>
 <div class="field"><label>${t("password")}</label><input type="password" name="password" required minlength="6" autocomplete="new-password"></div>
 <button class="btn btn-red" style="width:100%">${t("signup")}</button></form>
 <p class="meta" style="margin-top:16px">${t("haveAcc")} <a href="#login" style="color:var(--accent2)">${t("login")}</a></p></div>`;
 $("f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const b=e.target.querySelector("button");b.disabled=true;
  const {data,error}=await sb.auth.signUp({email:d.email,password:d.password,options:{data:{full_name:d.full_name,role:d.role},emailRedirectTo:location.origin+location.pathname}});
  b.disabled=false;
  if(error)return $("m").innerHTML=`<div class="msg msg-err">${esc(errText(error))}</div>`;
  if(!data.session){$("f").remove();$("m").innerHTML=`<div class="msg msg-ok">${t("checkMail")}</div>`}};
}
function viewReset(){
 $("view").innerHTML=`<div class="auth card"><h1>${t("newPass")}</h1><p class="sub"></p><div id="m"></div>
 <form id="f"><div class="field"><label>${t("newPass")}</label><input type="password" name="p" required minlength="6" autocomplete="new-password"></div>
 <button class="btn btn-red" style="width:100%">${t("savePass")}</button></form></div>`;

}

 ${data.length?`<div class="grid">${data.map(e=>`<a class="ev" href="#event-${e.id}"><span class="tag">${esc(SPORT[e.sport][L])}</span> ${evStatus(e.status)}

  :`<div class="card empty">${t("noEvents")}</div>`}`;
}

// --- draw ---
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function spreadClubs(regs){
 const g={};regs.forEach(r=>{const k=(r.club_name||"").trim().toLowerCase()||("_"+r.id);(g[k]=g[k]||[]).push(r)});
 const groups=shuffle(Object.values(g).map(shuffle)).sort((a,b)=>b.length-a.length);
 const out=[];let left=true;while(left){left=false;groups.forEach(x=>{if(x.length){out.push(x.shift());left=true}})}
 return out;
}
function seedOrder(n){let a=[1];while(a.length<n){const m=a.length*2+1;a=a.flatMap(x=>[x,m-x])}return a}
function roundRobin(list){const a=[...list];if(a.length%2)a.push(null);const n=a.length,rounds=[];
 for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];if(x&&y)pr.push([x,y])}rounds.push(pr);a.splice(1,0,a.pop())}return rounds}
function buildMatches(div,regs){
 const rows=[],D=div.id,list=spreadClubs(regs),n=list.length;
 const M=(part,round,position,red,blue,extra={})=>rows.push({division_id:D,part,round,position,red_id:red?red.id:null,blue_id:blue?blue.id:null,status:red&&blue?"ready":"waiting",...extra});
 if(div.bracket==="best_of_3"&&n===2){[1,2,3].forEach(r=>M("main",r,1,list[0],list[1]));return rows}
 if(div.bracket==="round_robin"||div.bracket==="pools"){
  const gcount=div.bracket==="pools"&&n>5?Math.ceil(n/4):1;const pools=Array.from({length:gcount},()=>[]);
  list.forEach((r,i)=>{const row=Math.floor(i/gcount),col=i%gcount;pools[row%2?gcount-1-col:col].push(r)});
  pools.forEach((p,gi)=>roundRobin(p).forEach((pr,ri)=>pr.forEach(([a,b],pi)=>M(gcount>1?"pool-"+String.fromCharCode(65+gi):"pool",ri+1,pi+1,a,b))));
  return rows}
 const size=Math.max(2,2**Math.ceil(Math.log2(Math.max(n,2)))),R=Math.log2(size),order=seedOrder(size);
 const slot=order.map(rank=>list[rank-1]||null);const adv={};
 for(let p=1;p<=size/2;p++){const a=slot[2*p-2],b=slot[2*p-1];
  if(a&&b)M("main",1,p,a,b);else{const w=a||b;M("main",1,p,a,b,{status:"done",winner_id:w?w.id:null,win_reason:"bye"});if(w)adv[p]=w}}
 for(let r=2;r<=R;r++)for(let p=1;p<=size/2**r;p++){
  let red=null,blue=null;if(r===2){red=adv[2*p-1]||null;blue=adv[2*p]||null}
  M("main",r,p,red,blue)}
 if(div.bracket==="single"&&R>=2)M("bronze",R,1,null,null);
 return rows;
}

  sb.from("registrations").select("id,status,club_name,profiles(full_name)").eq("division_id",divId).eq("status","confirmed")]);
 const nm={};(regs||[]).forEach(r=>nm[r.id]=r);
 const canDraw=me&&(me.id===d.events.organizer_id||me.role==="admin");
 const line=(id,cls,w,emptyTxt)=>id?`<div class="${cls} ${w===id?"w":w?"l":""}"><span>${esc(nm[id]?.profiles?.full_name||"—")}${nm[id]?.club_name?` <small>${esc(nm[id].club_name)}</small>`:""}</span></div>`:`<div class="${cls} e"><span>${emptyTxt}</span></div>`;
 const card=m=>`<div class="bm">${line(m.red_id,"r",m.winner_id,m.round===1&&m.part==="main"&&m.win_reason==="bye"?t("bye"):"…")}${line(m.blue_id,"b",m.winner_id,m.round===1&&m.part==="main"&&m.win_reason==="bye"?t("bye"):"…")}</div>`;
 const parts={};(ms||[]).forEach(m=>(parts[m.part]=parts[m.part]||[]).push(m));
 let html="";
 if(parts.main){const main=parts.main,R=Math.max(...main.map(m=>m.round));
  const label=r=>d.bracket==="best_of_3"?t("bout")+" "+r:r===R?t("final"):"1/"+2**(R-r);
  html+=`<div class="card"><div class="bracket">${Array.from({length:R},(_,i)=>i+1).map(r=>`<div class="bcol"><h5>${label(r)}</h5>${main.filter(m=>m.round===r).map(card).join("")}</div>`).join("")}</div>
  ${parts.bronze?`<h2 style="font-size:15px;margin-top:10px">${t("bronzeM")}</h2><div style="max-width:240px">${parts.bronze.map(card).join("")}</div>`:""}</div>`}
 Object.keys(parts).filter(k=>k.startsWith("pool")).sort().forEach(k=>{const pm=parts[k],ids=[...new Set(pm.flatMap(m=>[m.red_id,m.blue_id]).filter(Boolean))],R=Math.max(...pm.map(m=>m.round));
  html+=`<div class="card"><h2>${k==="pool"?t("b_round_robin"):t("pool")+" "+k.slice(5)}</h2><div class="names" style="margin-bottom:16px">${ids.map(i=>`<span>${esc(nm[i]?.profiles?.full_name||"—")}</span>`).join("")}</div>
  <div class="bracket">${Array.from({length:R},(_,i)=>i+1).map(r=>`<div class="bcol" style="justify-content:flex-start"><h5>${t("round")} ${r}</h5>${pm.filter(m=>m.round===r).map(card).join("")}</div>`).join("")}</div></div>`});
 const note={repechage_judo:"repNote",repechage_full:"repNote",double:"doubleNote",pools:"poolsNote"}[d.bracket];
 $("view").innerHTML=`<a href="#event-${d.events.id}" class="meta">${t("back")}</a>
 <div style="margin:14px 0 6px"><span class="tag">${esc(SPORT[d.events.sport][L])}</span></div>
 <h1>${esc(d.name)}</h1><p class="sub">${esc(d.events.title)} · ${t("system")}: ${t("b_"+d.bracket)} · ${(regs||[]).length} ${t("participants")}</p>
 ${canDraw?`<div class="toolbar" style="margin-bottom:18px"><button class="btn ${ms&&ms.length?"btn-line":"btn-red"}" onclick="doDraw('${d.id}','${d.events.id}',this,${ms&&ms.length?1:0})">${ms&&ms.length?t("redraw"):t("draw")}</button><a class="btn btn-line" href="#manage-${d.events.id}">${t("manage")}</a></div>`:""}
 ${note&&ms&&ms.length?`<div class="msg msg-info">${t(note)}</div>`:""}
 ${html||`<div class="card empty">${t("noDraw")}${(regs||[]).length?`<div class="names" style="justify-content:center;margin-top:14px">${regs.map(r=>`<span>${esc(r.profiles?.full_name)}</span>`).join("")}</div>`:""}</div>`}`;
}

/* ================= views: admin ================= */
async function viewAdmin(){
 if(me.role!=="admin"){$("view").innerHTML=`<div class="msg msg-err">${t("onlyAdmin")}</div>`;return}
 const {data,error}=await sb.rpc("admin_users");if(error)throw error;
 $("view").innerHTML=`<h1>${t("adminH")}</h1><p class="sub">${t("users")}: ${data.length}</p>
 <div class="card"><div class="field"><input id="q" placeholder="${t("search")}"></div><div class="tablewrap"><table id="ut"></table></div></div>`;
 const draw=()=>{const q=$("q").value.toLowerCase();
  $("ut").innerHTML=`<tr><th>${t("name")}</th><th>${t("role")}</th><th>${t("credits")}</th><th>${t("add")}</th></tr>`+data.filter(u=>!q||(u.full_name||"").toLowerCase().includes(q)||(u.email||"").toLowerCase().includes(q)).map(u=>`<tr>
  <td><b>${esc(u.full_name||"—")}</b><div class="meta">${esc(u.email)}</div></td>
  <td>${u.role==="admin"?t("r_admin"):`<select class="btn btn-line btn-sm" onchange="setRole('${u.id}',this.value)">${["athlete","coach","organizer"].map(r=>`<option value="${r}" ${u.role===r?"selected":""}>${t("r_"+r)}</option>`).join("")}</select>`}</td>
  <td style="font-weight:800;font-size:18px">${u.credits}</td>
  <td><div class="toolbar">${[10,100,500].map(n=>`<button class="btn btn-line btn-sm" onclick="$('qty_${u.id}').value=${n}">${n}</button>`).join("")}
   <input type="number" id="qty_${u.id}" placeholder="${t("qty")}" style="width:80px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)">
   <input id="note_${u.id}" placeholder="${t("note")}" style="min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text)">
   <button class="btn btn-red btn-sm" onclick="addCredits('${u.id}')">${t("add")}</button></div></td></tr>`).join("")};
 $("q").oninput=draw;draw();
}
async function addCredits(uid){const q=+$("qty_"+uid).value;if(!q)return $("qty_"+uid).focus();
 const {error}=await sb.rpc("add_credits",{org_id:uid,qty:q,comment:$("note_"+uid).value||null});if(error)return toast(errText(error));toast(t("addedT"));await loadMe();chrome();viewAdmin()}
async function setRole(uid,r){const {error}=await sb.rpc("admin_set_role",{user_id:uid,new_role:r});toast(error?errText(error):t("roleT"))}

/* ================= start ================= */
(async()=>{await loadMe();chrome();if(!recovery)route()})();
</script>
